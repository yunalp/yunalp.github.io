<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astroshooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #hud {
    width: 960px;
    display: flex;
    justify-content: space-between;
    padding: 10px;
    font-size: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,.6);
  }
  canvas {
    border: 4px solid #4a4a6a;
    border-radius: 8px;
    background: #05050f;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #hint {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="hud">
  <span> Punkte: <span id="score">0</span></span>
  <span> Leben: <span id="lives">3</span></span>
  <span> Welle: <span id="wave">1</span></span>
</div>
<canvas id="game" width="960" height="540"></canvas>
<div id="hint">Steuerung: ← → / A D drehen &nbsp;|&nbsp; ↑ / W Schub &nbsp;|&nbsp; Leertaste schießen &nbsp;|&nbsp; ↓ / S bremsen &nbsp;|&nbsp; R Neustart</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR' && game.state === 'over') init();
});
addEventListener('keyup', e => keys[e.code] = false);

const game = { state: 'play', score: 0, lives: 3, wave: 1, time: 0 };
let ship, bullets, asteroids, particles, stars, cooldown;

const rand = (a, b) => a + Math.random() * (b - a);

let audioCtx = null;
function beep(freq, dur, type, vol, slideTo) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function initStars() {
  stars = [];
  for (let i = 0; i < 140; i++)
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.5, 1.8), p: rand(0, 6.28), d: rand(0.2, 1) });
}

function wrapObj(o, m) {
  m = m || 0;
  if (o.x < -m) o.x = W + m; else if (o.x > W + m) o.x = -m;
  if (o.y < -m) o.y = H + m; else if (o.y > H + m) o.y = -m;
}

function makeAsteroid(x, y, r) {
  const verts = [];
  const n = 9 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = r * rand(0.72, 1.25);
    verts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  const sp = rand(0.4, 1.1) * (36 / r);
  return { x, y, r, vx: rand(-1, 1) * sp, vy: rand(-1, 1) * sp,
           rot: rand(0, 6.28), vr: rand(-0.025, 0.025), verts };
}

function spawnWave(w) {
  const count = Math.min(3 + w, 10);
  for (let i = 0; i < count; i++) {
    let x, y, tries = 0;
    do { x = rand(40, W - 40); y = rand(40, H - 40); tries++; }
    while (ship && Math.hypot(x - ship.x, y - ship.y) < 160 && tries < 50);
    asteroids.push(makeAsteroid(x, y, 42));
  }
}

function spawnParticles(x, y, color, n) {
  n = n || 12;
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: rand(-4, 4), vy: rand(-4, 4), life: rand(20, 40), color, size: rand(2, 4.5) });
}

function splitAsteroid(a) {
  if (a.r > 16) {
    const nr = a.r > 30 ? 24 : 13;
    for (let i = 0; i < 2; i++) {
      const c = makeAsteroid(a.x + rand(-6, 6), a.y + rand(-6, 6), nr);
      c.vx = a.vx + rand(-1.6, 1.6);
      c.vy = a.vy + rand(-1.6, 1.6);
      asteroids.push(c);
    }
  }
  game.score += a.r > 30 ? 20 : (a.r > 16 ? 50 : 100);
  updateHud();
}

function shoot() {
  const a = ship.angle;
  bullets.push({ x: ship.x + Math.cos(a) * 18, y: ship.y + Math.sin(a) * 18,
                 vx: Math.cos(a) * 8 + ship.vx * 0.25, vy: Math.sin(a) * 8 + ship.vy * 0.25, life: 55 });
  beep(880, 0.07, 'square', 0.035, 440);
}

function hurt() {
  game.lives--;
  updateHud();
  spawnParticles(ship.x, ship.y, '#66ccff', 26);
  beep(160, 0.35, 'sawtooth', 0.06, 40);
  if (game.lives <= 0) game.state = 'over';
  else {
    ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;
    ship.angle = -Math.PI / 2; ship.invuln = 150;
  }
}

function updateHud() {
  scoreEl.textContent = game.score;
  livesEl.textContent = game.lives;
  waveEl.textContent = game.wave;
}

function init() {
  game.state = 'play'; game.score = 0; game.lives = 3; game.wave = 1; game.time = 0;
  ship = { x: W / 2, y: H / 2, angle: -Math.PI / 2, vx: 0, vy: 0, r: 12, invuln: 120, thrust: false };
  bullets = []; asteroids = []; particles = []; cooldown = 0;
  if (!stars) initStars();
  spawnWave(1);
  updateHud();
}

function update() {
  game.time++;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.96; pt.vy *= 0.96; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  if (game.state !== 'play') return;
  const p = ship;

  if (keys['ArrowLeft'] || keys['KeyA']) p.angle -= 0.075;
  if (keys['ArrowRight'] || keys['KeyD']) p.angle += 0.075;

  p.thrust = !!(keys['ArrowUp'] || keys['KeyW']);
  if (p.thrust) {
    p.vx += Math.cos(p.angle) * 0.16;
    p.vy += Math.sin(p.angle) * 0.16;
    if (game.time % 3 === 0)
      spawnParticles(p.x - Math.cos(p.angle) * 14, p.y - Math.sin(p.angle) * 14, Math.random() < 0.5 ? '#ff9f43' : '#ffd32a', 1);
  }
  if (keys['ArrowDown'] || keys['KeyS']) { p.vx *= 0.94; p.vy *= 0.94; }

  p.vx *= 0.992; p.vy *= 0.992;
  const sp = Math.hypot(p.vx, p.vy), MAX = 6.5;
  if (sp > MAX) { p.vx = p.vx / sp * MAX; p.vy = p.vy / sp * MAX; }
  p.x += p.vx; p.y += p.vy;
  wrapObj(p, 14);
  if (p.invuln > 0) p.invuln--;

  if (cooldown > 0) cooldown--;
  if (keys['Space'] && cooldown <= 0) { shoot(); cooldown = 9; }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    wrapObj(b, 4);
    if (b.life <= 0) { bullets.splice(i, 1); continue; }
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
        asteroids.splice(j, 1);
        splitAsteroid(a);
        spawnParticles(a.x, a.y, '#ffaa55', a.r > 30 ? 18 : 10);
        beep(a.r > 30 ? 140 : 220, 0.22, 'sawtooth', 0.05, 50);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  for (const a of asteroids) { a.x += a.vx; a.y += a.vy; a.rot += a.vr; wrapObj(a, a.r); }

  if (p.invuln <= 0) {
    for (const a of asteroids) {
      if (Math.hypot(p.x - a.x, p.y - a.y) < a.r + p.r - 5) { hurt(); break; }
    }
  }

  if (asteroids.length === 0) {
    game.wave++;
    spawnWave(game.wave);
    updateHud();
  }
}

function draw() {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(game.time * 0.04 * s.d + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    ctx.moveTo(a.verts[0][0], a.verts[0][1]);
    for (let i = 1; i < a.verts.length; i++) ctx.lineTo(a.verts[i][0], a.verts[i][1]);
    ctx.closePath();
    ctx.fillStyle = 'rgba(70,70,110,.35)';
    ctx.fill();
    ctx.strokeStyle = '#b8b8d8';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = '#7df9ff';
  for (const b of bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill();
  }

  const p = ship;
  if (!(p.invuln > 0 && Math.floor(game.time / 4) % 2)) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    if (p.thrust && game.state === 'play') {
      ctx.fillStyle = '#ff9f43';
      ctx.beginPath();
      ctx.moveTo(-12, 5); ctx.lineTo(-20 - Math.random() * 6, 0); ctx.lineTo(-12, -5);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-12, 11); ctx.lineTo(-7, 0); ctx.lineTo(-12, -11);
    ctx.closePath();
    ctx.fillStyle = 'rgba(120,190,255,.25)';
    ctx.fill();
    ctx.strokeStyle = '#aee2ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  for (const pt of particles) {
    ctx.globalAlpha = Math.min(1, pt.life / 25);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  if (game.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, H / 2 - 30);
    ctx.font = '24px sans-serif';
    ctx.fillText('Punkte: ' + game.score, W / 2, H / 2 + 20);
    ctx.fillText('R drücken für Neustart', W / 2, H / 2 + 60);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
init();
loop();
})();
</script>
</body>
</html>
